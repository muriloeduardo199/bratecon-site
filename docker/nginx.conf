server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/ld+json application/xml text/plain image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
